<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>こむぎ堂 | 毎朝焼きたてのパン屋</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">こむぎ堂</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html" class="current">トップ</a></li>
          <li><a href="about.html">会社概要</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <img src="images/hero.png" alt="店内に並ぶ焼きたてのパン">
      <div class="hero-text">
        <h1>毎朝 6 時、焼きたてをお届けします</h1>
        <p>国産小麦と天然酵母で、毎日食べても飽きないパンを作っています。</p>
      </div>
    </section>

    <section class="container section">
      <h2>人気の商品</h2>
      <div class="cards">
        <article class="card">
          <img src="images/bread1.png" alt="クロワッサン">
          <h3>クロワッサン</h3>
          <p>バターの香りが広がる、サクサクの生地です。</p>
          <p class="price">220 円</p>
        </article>
        <article class="card">
          <img src="images/bread2.png" alt="食パン">
          <h3>食パン</h3>
          <p>しっとりもちもち。トーストがおすすめです。</p>
          <p class="price">380 円</p>
        </article>
        <article class="card">
          <img src="images/bread3.png" alt="メロンパン">
          <h3>メロンパン</h3>
          <p>外はカリッと、中はふんわり仕上げました。</p>
          <p class="price">180 円</p>
        </article>
      </div>
    </section>

    <section class="container section">
      <h2>お知らせ</h2>
      <ul class="news">
        <li><time datetime="2026-11-01">2026/11/01</time>冬季限定のシュトーレンの予約を始めました。</li>
        <li><time datetime="2026-10-15">2026/10/15</time>土曜日の営業時間を 18 時までに延長しました。</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 こむぎ堂</p>
  </footer>
</body>
</html>
