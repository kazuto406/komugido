<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | こむぎ堂</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">こむぎ堂</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">トップ</a></li>
          <li><a href="about.html">会社概要</a></li>
          <li><a href="contact.html" class="current">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>お問い合わせ</h1>
    <p>ご予約やご質問は、次のフォームからお送りください。</p>
    <form class="contact-form" action="#" method="post">
      <div class="field">
        <label for="name">お名前（必須）</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">メールアドレス（必須）</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="tel">電話番号（半角数字のみ）</label>
        <input type="tel" id="tel" name="tel" pattern="[0-9]{10,11}" placeholder="09012345678">
      </div>
      <div class="field">
        <label for="topic">お問い合わせの種類</label>
        <select id="topic" name="topic">
          <option value="reserve">商品の予約</option>
          <option value="question">商品についての質問</option>
          <option value="other">その他</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>ご希望の連絡方法</legend>
        <label><input type="radio" name="reply" value="mail" checked> メール</label>
        <label><input type="radio" name="reply" value="phone"> 電話</label>
      </fieldset>
      <div class="field">
        <label for="message">お問い合わせ内容（必須）</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <div class="field">
        <label><input type="checkbox" name="agree" required> 個人情報の取り扱いに同意する</label>
      </div>
      <button type="submit" class="btn">送信する</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 こむぎ堂</p>
  </footer>
</body>
</html>
